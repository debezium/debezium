name: 'Static Code Analysis'
description: 'Runs static code analysis tool'

inputs:
  tool-token:
    description: 'Static code tool authentication token'
    required: true
  shell:
    description: "The shell to use"
    required: false
    default: bash

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/setup-java

    - name: Build, test and analyze
      shell: ${{ inputs.shell }}
      env:
        SONAR_TOKEN: ${{ inputs.tool-token }}
      run: ./mvnw -B clean verify -Psonar -DskipITs
      # It is very interesting to check if we re able to run it like this
      # run: ./mvnw -B clean verify -Psonar