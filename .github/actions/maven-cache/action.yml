name: "Maven Cache"
description: "Restores the Maven ~/.m2/repository cache"

inputs:
  key:
    description: "The maven cache key to use, formatted as <prefix>-<pom-hash>"
    required: true
  save:
    description: "Whether to save the cache after the job completes"
    required: false
    default: 'false'

outputs:
  cache-hit:
    description: "Whether an exact match was found for the cache key"
    value: ${{ steps.cache-restore.outputs.cache-hit || steps.cache-check.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    # The final dash-separated element of the key is always a pom content hash; stripping
    # it yields the reference cache prefix, e.g. maven-debezium-test-push-build-.  Restoring
    # by prefix lets a build whose poms differ from the reference branch start from the
    # closest available cache instead of an empty repository.
    - name: Compute fallback restore key
      id: cache-meta
      shell: bash
      env:
        KEY: ${{ inputs.key }}
      run: echo "restore-prefix=${KEY%-*}-" >> "${GITHUB_OUTPUT}"

    # The Maven wrapper (distributionType=only-script) installs Maven under ~/.m2/wrapper,
    # which the repository cache below does not include.  It is cached separately, keyed on
    # the wrapper distribution URL, so a single small entry is shared by all jobs and is only
    # replaced when the Maven version changes.  It is deliberately not added as a path to the
    # repository cache, which would change that cache's version and invalidate its entries.
    # It is saved on a miss regardless of the save input, except in pull request runs, which
    # never save caches and only restore it, as an entry saved there would be scoped to the
    # pull request and not be usable by any other run.
    #
    # The properties file is resolved relative to this action rather than the workspace, as
    # some jobs check out the core repository into a subdirectory.
    - name: Compute Maven wrapper cache key
      id: wrapper-meta
      shell: bash
      env:
        CORE_DIR: ${{ github.action_path }}/../../..
        RUNNER_OS_NAME: ${{ runner.os }}
      run: |
        core_dir="$(cd "${CORE_DIR}" && pwd)"
        url="$(sed -n 's/^distributionUrl=//p' "${core_dir}/.mvn/wrapper/maven-wrapper.properties" | tr -d '[:space:]')"
        if [ -z "${url}" ]; then
          echo "::error::Cannot read distributionUrl from ${core_dir}/.mvn/wrapper/maven-wrapper.properties"
          exit 1
        fi
        name="${url##*/}"
        name="${name%.*}"
        name="${name%-bin}"
        echo "core-dir=${core_dir}" >> "${GITHUB_OUTPUT}"
        echo "url=${url}" >> "${GITHUB_OUTPUT}"
        echo "name=${name}" >> "${GITHUB_OUTPUT}"
        echo "key=maven-wrapper-${RUNNER_OS_NAME}-$(printf '%s' "${url}" | sha256sum | cut -c1-16)" >> "${GITHUB_OUTPUT}"

    - name: Restore Maven wrapper distribution (read-only)
      if: ${{ github.event_name == 'pull_request' }}
      id: wrapper-restore
      uses: actions/cache/restore@v6
      with:
        path: ~/.m2/wrapper
        key: ${{ steps.wrapper-meta.outputs.key }}

    - name: Cache Maven wrapper distribution
      if: ${{ github.event_name != 'pull_request' }}
      id: wrapper-cache
      uses: actions/cache@v6
      with:
        path: ~/.m2/wrapper
        key: ${{ steps.wrapper-meta.outputs.key }}

    # On a cache miss, install the wrapper distribution up front with a few retries, since
    # mvnw itself makes a single download attempt and fails the build on a transient error.
    # Success is judged by the installed distribution rather than the exit code, so that the
    # step also works when Java has not been set up yet.
    - name: Install Maven wrapper distribution
      if: ${{ (steps.wrapper-restore.outputs.cache-hit || steps.wrapper-cache.outputs.cache-hit) != 'true' }}
      shell: bash
      working-directory: ${{ steps.wrapper-meta.outputs.core-dir }}
      env:
        WRAPPER_URL: ${{ steps.wrapper-meta.outputs.url }}
        WRAPPER_NAME: ${{ steps.wrapper-meta.outputs.name }}
      run: |
        installed() {
          compgen -G "${HOME}/.m2/wrapper/dists/${WRAPPER_NAME}/*/bin/mvn" > /dev/null
        }
        for attempt in 1 2 3; do
          ./mvnw -B -v || true
          if installed; then
            exit 0
          fi
          echo "Maven wrapper distribution not installed (attempt ${attempt}/3)"
          if [ "${attempt}" -lt 3 ]; then
            sleep $((attempt * 10))
          fi
        done
        echo "::warning::Failed to install the Maven wrapper distribution from ${WRAPPER_URL}"

    - name: Restore Maven Repository (read-only)
      if: ${{ inputs.save != 'true' }}
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: ~/.m2/repository
        key: ${{ inputs.key }}
        restore-keys: ${{ steps.cache-meta.outputs.restore-prefix }}

    - name: Cache Maven Repository
      if: ${{ inputs.save == 'true' }}
      id: cache-check
      uses: actions/cache@v6
      with:
        path: ~/.m2/repository
        key: ${{ inputs.key }}
        restore-keys: ${{ steps.cache-meta.outputs.restore-prefix }}

    # Pull request runs never save caches; they restore the reference branch cache above
    # and then overlay the dependency delta captured by the build_cache job earlier in
    # this run, which contains any dependencies the PR added on top of the reference
    # cache.  The download is tolerant: when no delta artifact exists (e.g. an expired
    # artifact on a stale re-run), the build simply downloads what it is missing.
    - name: Download PR dependency delta
      if: ${{ github.event_name == 'pull_request' }}
      id: delta
      continue-on-error: true
      uses: actions/download-artifact@v8
      with:
        name: maven-repo-delta-pr-${{ github.event.pull_request.number }}
        path: ${{ runner.temp }}/maven-repo-delta

    - name: Apply PR dependency delta
      if: ${{ github.event_name == 'pull_request' && steps.delta.outcome == 'success' }}
      shell: bash
      run: |
        mkdir -p ~/.m2/repository
        tar -xzf "${RUNNER_TEMP}/maven-repo-delta/maven-repo-delta.tgz" -C ~/.m2/repository
