name: Tool Images

on:
  workflow_dispatch:
    inputs:
      images_repository:
        description: 'Repository with Debezium Dockerfiles'
        required: false
        default: 'debezium/container-images'
      images_branch:
        description: 'Branch used for images repository'
        required: false
        default: 'main'
      tag:
        description: 'Tag used for building images'
        required: false
        default: 'latest'
  schedule:
    - cron: '0 0 * * 1'  # Weekly on Monday at midnight UTC
  workflow_call:
    inputs:
      images_repository:
        type: string
        default: 'debezium/container-images'
      images_branch:
        type: string
        default: 'main'
      tag:
        type: string
        default: 'latest'

jobs:
  setup-parameters:
    name: Setup Parameters
    runs-on: ubuntu-latest
    outputs:
      images_repository: ${{ steps.params.outputs.images_repository }}
      images_branch: ${{ steps.params.outputs.images_branch }}
      tag: ${{ steps.params.outputs.tag }}

    steps:
      - name: Set parameters
        id: params
        run: |
          echo "images_repository=${{ inputs.images_repository || 'debezium/container-images' }}" >> $GITHUB_OUTPUT
          echo "images_branch=${{ inputs.images_branch || 'main' }}" >> $GITHUB_OUTPUT
          echo "tag=${{ inputs.tag || 'latest' }}" >> $GITHUB_OUTPUT

  build-tool-images:
    name: Build ${{ matrix.tool }}
    needs: setup-parameters
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        tool:
          - tooling
          - website-builder

    steps:
      - name: Checkout container-images repository
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.setup-parameters.outputs.images_repository }}
          ref: ${{ needs.setup-parameters.outputs.images_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Build and push ${{ matrix.tool }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.tool }}
          push: true
          tags: quay.io/debezium/${{ matrix.tool }}:${{ needs.setup-parameters.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            DEBEZIUM_DOCKER_REGISTRY_PRIMARY_NAME=quay.io/debezium

      - name: Send Zulip notification on failure
        if: failure()
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_TOKEN }}
          email: ${{ secrets.ZULIP_TOKEN_EMAIL_ADDRESS }}
          organization-url: "https://debezium.zulipchat.com"
          to: dev
          type: "stream"
          topic: alerts
          content: |
            ⚠️ **Tool image build failed: ${{ matrix.tool }}**

            **Repository:** ${{ needs.setup-parameters.outputs.images_repository }}
            **Branch:** ${{ needs.setup-parameters.outputs.images_branch }}
            **Tag:** ${{ needs.setup-parameters.outputs.tag }}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
