name: Contributor Check
on:
  # Runs with the read-only token of the pull request. Comments are posted by pr-check-comments.yml,
  # which is triggered through workflow_run from the result recorded by this workflow.
  pull_request:
    branches:
      - main
      - 1.*
      - 2.*
      - 3.*
      - 4.*
    types: [ opened, reopened, synchronize ]
permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No checkout: the three files are fetched as raw content from both the base branch and the pull
      # request head, so that a pull request which adds the missing contributor details passes the check.
      - name: Check if COPYRIGHT.txt has author name?
        id: check
        env:
          pull_request_number: ${{ github.event.pull_request.number }}
          pull_request_head_repo: ${{ github.event.pull_request.head.repo.full_name }}
          pull_request_head_sha: ${{ github.event.pull_request.head.sha }}
        run: |
          USER_NOT_FOUND=false
          curl -H 'Accept: application/vnd.github.v3.raw' https://raw.githubusercontent.com/debezium/debezium/main/COPYRIGHT.txt >> COPYRIGHT_MAIN.txt
          curl -H 'Accept: application/vnd.github.v3.raw' https://raw.githubusercontent.com/debezium/debezium/main/jenkins-jobs/scripts/config/Aliases.txt >> ALIASES_MAIN.txt
          curl -H 'Accept: application/vnd.github.v3.raw' https://raw.githubusercontent.com/debezium/debezium/main/jenkins-jobs/scripts/config/FilteredNames.txt >> FILTEREDNAMES_MAIN.txt
          curl --silent --fail -H 'Accept: application/vnd.github.v3.raw' "https://raw.githubusercontent.com/$pull_request_head_repo/$pull_request_head_sha/COPYRIGHT.txt" >> COPYRIGHT_PR.txt || true
          curl --silent --fail -H 'Accept: application/vnd.github.v3.raw' "https://raw.githubusercontent.com/$pull_request_head_repo/$pull_request_head_sha/jenkins-jobs/scripts/config/Aliases.txt" >> ALIASES_PR.txt || true
          curl --silent --fail -H 'Accept: application/vnd.github.v3.raw' "https://raw.githubusercontent.com/$pull_request_head_repo/$pull_request_head_sha/jenkins-jobs/scripts/config/FilteredNames.txt" >> FILTEREDNAMES_PR.txt || true
          cat COPYRIGHT_PR.txt COPYRIGHT_MAIN.txt | sort -u > COPYRIGHT_CHECK.txt
          cat ALIASES_MAIN.txt ALIASES_PR.txt | sort -u > ALIASES_CHECK.txt
          cat FILTEREDNAMES_MAIN.txt FILTEREDNAMES_PR.txt | sort -u > FILTEREDNAMES_CHECK.txt

          curl --silent -X "GET" https://api.github.com/repos/debezium/debezium/pulls/$pull_request_number/commits | jq '.[] | {author: .commit.author.name}' | jq -r '.author' | uniq >> AUTHOR_NAME.txt

          while IFS=" " read -r AUTHOR;
          do
            if ! grep -qi "$AUTHOR" COPYRIGHT_CHECK.txt; then
              if ! grep -qi "$AUTHOR" ALIASES_CHECK.txt; then
                if ! grep -qi "$AUTHOR" FILTEREDNAMES_CHECK.txt; then
                  echo "USER_NOT_FOUND=true"
                  USER_NOT_FOUND=true
                  break
                fi
              fi
            fi
          done < AUTHOR_NAME.txt
          echo "USER_NOT_FOUND=$USER_NOT_FOUND" >> $GITHUB_OUTPUT
      - name: Record check result
        env:
          pull_request_number: ${{ github.event.pull_request.number }}
          check_result: ${{ steps.check.outputs.USER_NOT_FOUND == 'true' && 'fail' || 'pass' }}
        run: |
          mkdir pr-check-result
          echo "$pull_request_number" > pr-check-result/pr-number
          echo "$check_result" > pr-check-result/result
      - name: Upload check result
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-result-contributor
          path: pr-check-result/
          retention-days: 1
      - name: Check failure
        if: ${{ steps.check.outputs.USER_NOT_FOUND == 'true' }}
        uses: actions/github-script@v9
        continue-on-error: false
        with:
          script: |
            throw new Error('Add new user, @${{ github.event.pull_request.user.login }} to COPYRIGHT.txt and Aliases.txt')
