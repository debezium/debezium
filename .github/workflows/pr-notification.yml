name: PR Build Notification

on:
  workflow_run:
    workflows: ["Build Debezium (PR)"]
    types:
      - completed

jobs:
  notify_pr_author:
    name: "Notify PR Author"
    runs-on: ubuntu-latest
    # Only run if the triggering workflow was for a pull request
    if: github.event.workflow_run.event == 'pull_request'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/config/zulip-user-mapping.txt
          sparse-checkout-cone-mode: false

      - name: Get PR information
        uses: actions/github-script@v7
        with:
          script: |
            const pull_requests = context.payload.workflow_run.pull_requests;
            if (!pull_requests || pull_requests.length === 0) {
              core.setFailed('No pull request found in workflow run');
              return;
            }
            
            const pr = pull_requests[0];
            core.exportVariable('PR_NUMBER', pr.number);
            core.exportVariable('PR_TITLE', pr.head.ref);
            core.exportVariable('PR_AUTHOR', pr.head.user.login);
            core.exportVariable('PR_URL', pr.html_url);
            
            // Get full PR details for title
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            core.exportVariable('PR_TITLE', prData.title);

      - name: Determine overall result
        id: result
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"
          
          if [ "$CONCLUSION" = "success" ]; then
            echo "overall_status=success" >> $GITHUB_OUTPUT
            echo "status_emoji=✅" >> $GITHUB_OUTPUT
          elif [ "$CONCLUSION" = "failure" ]; then
            echo "overall_status=failed" >> $GITHUB_OUTPUT
            echo "status_emoji=❌" >> $GITHUB_OUTPUT
          elif [ "$CONCLUSION" = "cancelled" ]; then
            echo "overall_status=cancelled" >> $GITHUB_OUTPUT
            echo "status_emoji=⚠️" >> $GITHUB_OUTPUT
          else
            echo "overall_status=unknown" >> $GITHUB_OUTPUT
            echo "status_emoji=❓" >> $GITHUB_OUTPUT
          fi

      - name: Read user mapping configuration
        id: read-mapping
        run: |
          MAPPING_FILE=".github/config/zulip-user-mapping.txt"

          if [ ! -f "$MAPPING_FILE" ]; then
            echo "Mapping file not found: $MAPPING_FILE"
            echo "user_found=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          GITHUB_HANDLE="${{ env.PR_AUTHOR }}"
          echo "PR author GitHub handle: $GITHUB_HANDLE"

          ZULIP_USER_ID=$(grep -v "^#" "$MAPPING_FILE" | grep -v "^$" | grep "^${GITHUB_HANDLE}," | cut -d',' -f2 | tr -d '[:space:]')

          if [ -z "$ZULIP_USER_ID" ]; then
            echo "No Zulip mapping found for GitHub user: $GITHUB_HANDLE"
            echo "user_found=false" >> $GITHUB_OUTPUT
          else
            echo "Found Zulip user ID: $ZULIP_USER_ID"
            echo "user_found=true" >> $GITHUB_OUTPUT
            echo "zulip_user_id=$ZULIP_USER_ID" >> $GITHUB_OUTPUT
          fi

      - name: Send Zulip private message
        if: steps.read-mapping.outputs.user_found == 'true'
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_TOKEN }}
          email: ${{ secrets.ZULIP_TOKEN_EMAIL_ADDRESS }}
          organization-url: "https://debezium.zulipchat.com"
          type: "private"
          to: '[${{ steps.read-mapping.outputs.zulip_user_id }}]'
          content: |
            ${{ steps.result.outputs.status_emoji }} **PR Build Completed**

            **PR Title:** ${{ env.PR_TITLE }}
            **PR Number:** #${{ env.PR_NUMBER }}
            **Repository:** ${{ github.repository }}
            **PR URL:** ${{ env.PR_URL }}

            **Build Status:** ${{ steps.result.outputs.overall_status }}

            **Workflow Run:** ${{ github.event.workflow_run.html_url }}

      - name: Log notification status
        run: |
          if [ "${{ steps.read-mapping.outputs.user_found }}" = "true" ]; then
            echo "✅ Zulip notification sent to user ID: ${{ steps.read-mapping.outputs.zulip_user_id }}"
          else
            echo "ℹ️ No notification sent - user not in mapping file"
          fi
