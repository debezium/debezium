name: PR Build Notification

on:
  workflow_run:
    workflows: ["Build Debezium (PR)"]
    types:
      - completed

jobs:
  notify_pr_author:
    name: "Notify PR Author"
    runs-on: ubuntu-latest
    # Only run on the upstream repository and if the triggering workflow was for a pull request
    if: github.repository == 'debezium/debezium' && github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/config/zulip-user-mapping.txt
          sparse-checkout-cone-mode: false

      - name: Find PR and check user mapping
        id: check-notification
        run: |
          # Get workflow run details
          HEAD_BRANCH="${{ github.event.workflow_run.head_branch }}"
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"

          echo "Looking for PR with branch: $HEAD_BRANCH"

          # Try to find PR using gh CLI
          PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --state all --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ]; then
            echo "No pull request found for branch $HEAD_BRANCH - skipping notification"
            echo "should_notify=false" >> $GITHUB_OUTPUT
            echo "skip_reason=no_pr_found" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Found PR #$PR_NUMBER"

          # Get PR author
          PR_AUTHOR=$(gh pr view "$PR_NUMBER" --json author --jq '.author.login')
          echo "PR author: $PR_AUTHOR"

          # Check if user is in mapping file
          MAPPING_FILE=".github/config/zulip-user-mapping.txt"

          if [ ! -f "$MAPPING_FILE" ]; then
            echo "Mapping file not found - skipping notification"
            echo "should_notify=false" >> $GITHUB_OUTPUT
            echo "skip_reason=no_mapping_file" >> $GITHUB_OUTPUT
            exit 0
          fi

          ZULIP_USER_ID=$(grep -v "^#" "$MAPPING_FILE" | grep -v "^$" | grep "^${PR_AUTHOR}," | cut -d',' -f2 | tr -d '[:space:]')

          if [ -z "$ZULIP_USER_ID" ]; then
            echo "User $PR_AUTHOR not in mapping file - skipping notification"
            echo "should_notify=false" >> $GITHUB_OUTPUT
            echo "skip_reason=user_not_mapped" >> $GITHUB_OUTPUT
            echo "pr_author=$PR_AUTHOR" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "User $PR_AUTHOR is mapped to Zulip ID: $ZULIP_USER_ID"
          echo "should_notify=true" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "pr_author=$PR_AUTHOR" >> $GITHUB_OUTPUT
          echo "zulip_user_id=$ZULIP_USER_ID" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Get full PR details
        if: steps.check-notification.outputs.should_notify == 'true'
        id: pr-details
        run: |
          PR_NUMBER="${{ steps.check-notification.outputs.pr_number }}"

          # Get full PR details
          PR_DATA=$(gh pr view "$PR_NUMBER" --json title,url,author)

          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
          PR_URL=$(echo "$PR_DATA" | jq -r '.url')

          echo "PR_TITLE=$PR_TITLE" >> $GITHUB_ENV
          echo "PR_NUMBER=$PR_NUMBER" >> $GITHUB_ENV
          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          echo "PR_AUTHOR=${{ steps.check-notification.outputs.pr_author }}" >> $GITHUB_ENV
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Determine overall result
        if: steps.check-notification.outputs.should_notify == 'true'
        id: result
        run: |
          CONCLUSION="${{ github.event.workflow_run.conclusion }}"

          if [ "$CONCLUSION" = "success" ]; then
            echo "overall_status=success" >> $GITHUB_OUTPUT
            echo "status_emoji=✅" >> $GITHUB_OUTPUT
          elif [ "$CONCLUSION" = "failure" ]; then
            echo "overall_status=failed" >> $GITHUB_OUTPUT
            echo "status_emoji=❌" >> $GITHUB_OUTPUT
          elif [ "$CONCLUSION" = "cancelled" ]; then
            echo "overall_status=cancelled" >> $GITHUB_OUTPUT
            echo "status_emoji=⚠️" >> $GITHUB_OUTPUT
          else
            echo "overall_status=unknown" >> $GITHUB_OUTPUT
            echo "status_emoji=❓" >> $GITHUB_OUTPUT
          fi

      - name: Send Zulip private message
        if: steps.check-notification.outputs.should_notify == 'true'
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_TOKEN }}
          email: ${{ secrets.ZULIP_TOKEN_EMAIL_ADDRESS }}
          organization-url: "https://debezium.zulipchat.com"
          type: "private"
          to: '${{ steps.check-notification.outputs.zulip_user_id }}'
          content: |
            ${{ steps.result.outputs.status_emoji }} **PR Build Completed**

            **PR Title:** ${{ env.PR_TITLE }}
            **PR Number:** #${{ env.PR_NUMBER }}
            **Repository:** ${{ github.repository }}
            **PR URL:** ${{ env.PR_URL }}

            **Build Status:** ${{ steps.result.outputs.overall_status }}

            **Workflow Run:** ${{ github.event.workflow_run.html_url }}

      - name: Log notification status
        run: |
          if [ "${{ steps.check-notification.outputs.should_notify }}" = "true" ]; then
            echo "✅ Zulip notification sent to user ID: ${{ steps.check-notification.outputs.zulip_user_id }}"
          else
            REASON="${{ steps.check-notification.outputs.skip_reason }}"
            case "$REASON" in
              "no_pr_found")
                echo "ℹ️ No notification sent - no PR found for this workflow run"
                ;;
              "no_mapping_file")
                echo "ℹ️ No notification sent - mapping file not found"
                ;;
              "user_not_mapped")
                echo "ℹ️ No notification sent - user ${{ steps.check-notification.outputs.pr_author }} not in mapping file"
                ;;
              *)
                echo "ℹ️ No notification sent - unknown reason"
                ;;
            esac
          fi
