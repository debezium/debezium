name: PRs Without Linked Issue

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even outside the debezium/debezium repository (for testing)"
        type: boolean
        default: false

env:
  # Space-separated list of debezium org repositories to skip (without the org prefix).
  IGNORED_REPOS: >-
    debezium-design-documents
  # How far back to look for unlinked PRs (any value accepted by `date -d`, e.g. "30 days", "2 weeks").
  PR_MAX_AGE: "30 days"

jobs:
  check-unlinked-prs:
    name: "Find open PRs not linked to a GitHub issue"
    runs-on: ubuntu-latest
    if: github.repository == 'debezium/debezium' || inputs.force == true

    steps:
      - name: Find PRs without a linked issue
        id: find-prs
        run: |
          CUTOFF=$(date -u -d "${PR_MAX_AGE} ago" '+%Y-%m-%dT%H:%M:%SZ')
          echo "Reporting PRs created after: ${CUTOFF}"

          PR_LIST=""

          # Build ignored repos array from the IGNORED_REPOS env var (space-separated names)
          IGNORED_REPOS_ARRAY=()
          for repo in $IGNORED_REPOS; do
            IGNORED_REPOS_ARRAY+=("debezium/${repo}")
          done
          echo "Ignoring repositories: ${IGNORED_REPOS_ARRAY[*]:-none}"

          is_ignored() {
            local repo="$1"
            for ignored in "${IGNORED_REPOS_ARRAY[@]:-}"; do
              [ "$repo" = "$ignored" ] && return 0
            done
            return 1
          }

          # Fetch all non-archived public repositories of the debezium organization
          REPOS=$(gh api --paginate "orgs/debezium/repos?type=public" \
            --jq '.[] | select(.archived == false) | .full_name')

          for REPO in $REPOS; do
            if is_ignored "$REPO"; then
              echo "Skipping ignored repository: $REPO"
              continue
            fi
            echo "Checking repository: $REPO"

            # List open PRs where GitHub has not wired up a closing issue reference.
            # closingIssuesReferences is what the GUI "Development" section reflects:
            # it is only populated when the body uses a closing keyword (Fixes / Closes /
            # Resolves) before the issue reference.
            REPO_LIST=$(gh pr list \
              --repo "$REPO" \
              --state open \
              --limit 500 \
              --json number,title,url,createdAt,closingIssuesReferences \
              --jq '.[] | select(.createdAt >= "'"${CUTOFF}"'") | select(.title | test("^\\[(docs|ci|jenkins-jobs|release)\\]"; "i") | not) | select((.closingIssuesReferences | length) == 0) | "- [\(.number)](\(.url)): \(.title)"' \
              2>&1) || { echo "  Warning: failed to fetch PRs for ${REPO}: ${REPO_LIST}"; continue; }

            if [ -z "$REPO_LIST" ]; then
              continue
            fi

            echo "  Found unlinked PR(s) in ${REPO}"
            PR_LIST="${PR_LIST}$(printf '\n**%s**\n%s\n' "${REPO}" "${REPO_LIST}")"
          done

          if [ -n "$PR_LIST" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "pr_list<<EOF"
              echo "$PR_LIST"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "All open PRs across the debezium org have a properly linked issue."
          fi
        env:
          GH_TOKEN: ${{ secrets.DEBEZIUM_GH_TOKEN }}

      - name: Send Zulip notification
        if: steps.find-prs.outputs.found == 'true'
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_TOKEN }}
          email: ${{ secrets.ZULIP_TOKEN_EMAIL_ADDRESS }}
          organization-url: "https://debezium.zulipchat.com"
          to: dev
          type: "stream"
          topic: alerts
          content: |
            🔗 **Open PRs Without a Linked GitHub Issue**

            The following open pull requests have no issue linked in the GitHub "Development" section. Please update the PR body to use a closing keyword (`Fixes`, `Closes`, or `Resolves`) followed by the issue reference, e.g. `Fixes debezium/dbz#NNN`.

            ${{ steps.find-prs.outputs.pr_list }}

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
