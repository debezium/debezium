name: Release Container Images

on:
  workflow_dispatch:
    inputs:
      debezium_repository:
        description: 'Repository from which Debezium is built'
        required: false
        default: 'debezium/debezium'
      images_repository:
        description: 'Repository with Debezium Dockerfiles'
        required: false
        default: 'debezium/container-images'
      images_branch:
        description: 'Branch used for images repository'
        required: false
        default: 'main'
      platforms:
        description: 'Platforms to build (comma-separated)'
        required: false
        default: 'linux/amd64,linux/arm64'
      streams_to_build_count:
        description: 'How many most recent streams should be built'
        required: false
        default: '2'
      tags_per_stream_count:
        description: 'How many most recent tags per stream should be built'
        required: false
        default: '1'
      skip_ui:
        description: 'Skip building UI image'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Dry run mode (do not push images)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'  # Daily at midnight UTC
  workflow_call:
    inputs:
      debezium_repository:
        type: string
        default: 'debezium/debezium'
      images_repository:
        type: string
        default: 'debezium/container-images'
      images_branch:
        type: string
        default: 'main'
      platforms:
        type: string
        default: 'linux/amd64,linux/arm64'
      streams_to_build_count:
        type: string
        default: '2'
      tags_per_stream_count:
        type: string
        default: '1'
      skip_ui:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false

jobs:
  setup-parameters:
    name: Setup Parameters
    runs-on: ubuntu-latest
    outputs:
      debezium_repository: ${{ steps.params.outputs.debezium_repository }}
      images_repository: ${{ steps.params.outputs.images_repository }}
      images_branch: ${{ steps.params.outputs.images_branch }}
      platforms: ${{ steps.params.outputs.platforms }}
      streams_to_build_count: ${{ steps.params.outputs.streams_to_build_count }}
      tags_per_stream_count: ${{ steps.params.outputs.tags_per_stream_count }}
      skip_ui: ${{ steps.params.outputs.skip_ui }}
      dry_run: ${{ steps.params.outputs.dry_run }}

    steps:
      - name: Set parameters
        id: params
        run: |
          echo "debezium_repository=${{ inputs.debezium_repository || 'debezium/debezium' }}" >> $GITHUB_OUTPUT
          echo "images_repository=${{ inputs.images_repository || 'debezium/container-images' }}" >> $GITHUB_OUTPUT
          echo "images_branch=${{ inputs.images_branch || 'main' }}" >> $GITHUB_OUTPUT
          echo "platforms=${{ inputs.platforms || 'linux/amd64,linux/arm64' }}" >> $GITHUB_OUTPUT
          echo "streams_to_build_count=${{ inputs.streams_to_build_count || '2' }}" >> $GITHUB_OUTPUT
          echo "tags_per_stream_count=${{ inputs.tags_per_stream_count || '1' }}" >> $GITHUB_OUTPUT
          echo "skip_ui=${{ inputs.skip_ui || 'false' }}" >> $GITHUB_OUTPUT
          echo "dry_run=${{ inputs.dry_run || 'false' }}" >> $GITHUB_OUTPUT

  discover-versions:
    name: Discover Versions and Build List
    needs: setup-parameters
    runs-on: ubuntu-latest
    outputs:
      streams: ${{ steps.versions.outputs.streams }}
      stable_stream: ${{ steps.versions.outputs.stable_stream }}
      build_list: ${{ steps.versions.outputs.build_list }}

    steps:
      - name: Checkout debezium repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Discover versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Fetch all tags from debezium repository
          DEBEZIUM_REPO="${{ needs.setup-parameters.outputs.debezium_repository }}"
          STREAMS_COUNT="${{ needs.setup-parameters.outputs.streams_to_build_count }}"
          TAGS_PER_STREAM="${{ needs.setup-parameters.outputs.tags_per_stream_count }}"

          gh api repos/${DEBEZIUM_REPO}/tags --paginate | \
            jq -r '.[].name' | \
            grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | \
            python3 .github/scripts/release-container-images/process-versions.py \
              --streams-count ${STREAMS_COUNT} \
              --tags-per-stream ${TAGS_PER_STREAM} >> $GITHUB_OUTPUT

      - name: Display discovered versions
        run: |
          echo "Streams to build: ${{ steps.versions.outputs.streams }}"
          echo "Stable stream: ${{ steps.versions.outputs.stable_stream }}"
          echo "Build list: ${{ steps.versions.outputs.build_list }}"

  build-master-images:
    name: Build Master Images
    needs: [setup-parameters, discover-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout container-images repository
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.setup-parameters.outputs.images_repository }}
          ref: ${{ needs.setup-parameters.outputs.images_branch }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Setup local builder
        run: |
          ./setup-local-builder.sh
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Build all images for latest streams
        env:
          DRY_RUN: ${{ needs.setup-parameters.outputs.dry_run }}
          SKIP_UI: ${{ needs.setup-parameters.outputs.skip_ui }}
          DEBEZIUM_VERSIONS: ${{ needs.discover-versions.outputs.streams }}
          LATEST_STREAM: ${{ needs.discover-versions.outputs.stable_stream }}
          PLATFORM_CONDUCTOR_PLATFORM: linux/amd64
          PLATFORM_STAGE_PLATFORM: linux/amd64
          MULTIPLATFORM_PLATFORMS: ${{ needs.setup-parameters.outputs.platforms }}
          DEBEZIUM_DOCKER_REGISTRY_PRIMARY_NAME: quay.io/debezium
        run: |
          echo "Building images for streams: $DEBEZIUM_VERSIONS"
          echo "Latest stable stream: $LATEST_STREAM"
          echo "Platforms: $MULTIPLATFORM_PLATFORMS"
          echo "Dry run: $DRY_RUN"
          echo "Skip UI: $SKIP_UI"
          ./build-all-multiplatform.sh

      - name: Send Zulip notification on failure
        if: failure()
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_TOKEN }}
          email: ${{ secrets.ZULIP_TOKEN_EMAIL_ADDRESS }}
          organization-url: "https://debezium.zulipchat.com"
          to: dev
          type: "stream"
          topic: alerts
          content: |
            ⚠️ **Release container images build failed (master images)**

            **Debezium repository:** ${{ needs.setup-parameters.outputs.debezium_repository }}
            **Images repository:** ${{ needs.setup-parameters.outputs.images_repository }}
            **Images branch:** ${{ needs.setup-parameters.outputs.images_branch }}
            **Streams:** ${{ needs.discover-versions.outputs.streams }}
            **Platforms:** ${{ needs.setup-parameters.outputs.platforms }}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  build-tagged-images:
    name: Build Tagged Images
    needs: [setup-parameters, discover-versions]
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Checkout container-images repository
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.setup-parameters.outputs.images_repository }}
          ref: ${{ needs.setup-parameters.outputs.images_branch }}
          fetch-depth: 0  # Fetch all history for all tags

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}

      - name: Setup local builder
        run: |
          ./setup-local-builder.sh
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Checkout debezium repository for build script
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: main
          path: debezium-repo

      - name: Build images for each tag sequentially
        env:
          BUILD_LIST: ${{ needs.discover-versions.outputs.build_list }}
          DRY_RUN: ${{ needs.setup-parameters.outputs.dry_run }}
          SKIP_UI: ${{ needs.setup-parameters.outputs.skip_ui }}
          LATEST_STREAM: ${{ needs.discover-versions.outputs.stable_stream }}
          PLATFORM_CONDUCTOR_PLATFORM: linux/amd64
          PLATFORM_STAGE_PLATFORM: linux/amd64
          MULTIPLATFORM_PLATFORMS: ${{ needs.setup-parameters.outputs.platforms }}
          IMAGES_BRANCH: ${{ needs.setup-parameters.outputs.images_branch }}
          DEBEZIUM_DOCKER_REGISTRY_PRIMARY_NAME: quay.io/debezium
        run: |
          chmod +x debezium-repo/.github/scripts/release-container-images/build-tagged-images.sh
          debezium-repo/.github/scripts/release-container-images/build-tagged-images.sh

      - name: Send Zulip notification on failure
        if: failure()
        uses: zulip/github-actions-zulip/send-message@v2
        with:
          api-key: ${{ secrets.ZULIP_TOKEN }}
          email: ${{ secrets.ZULIP_TOKEN_EMAIL_ADDRESS }}
          organization-url: "https://debezium.zulipchat.com"
          to: dev
          type: "stream"
          topic: alerts
          content: |
            ⚠️ **Release container images build failed (tagged images)**

            **Debezium repository:** ${{ needs.setup-parameters.outputs.debezium_repository }}
            **Images repository:** ${{ needs.setup-parameters.outputs.images_repository }}
            **Images branch:** ${{ needs.setup-parameters.outputs.images_branch }}
            **Build list:** ${{ needs.discover-versions.outputs.build_list }}
            **Platforms:** ${{ needs.setup-parameters.outputs.platforms }}
            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
