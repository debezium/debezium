name: Commit Sign-off Check
on:
  # Runs with the read-only token of the pull request. Comments are added/removed by pr-check-comments.yml,
  # which is triggered through workflow_run from the result recorded by this workflow.
  - pull_request

permissions:
  contents: read
  pull-requests: read

jobs:
  # Checks that all commits contain sign-offs
  check-signed-commits:
    name: Check signed commits
    runs-on: ubuntu-latest
    steps:
      - uses: debezium/dbz/.github/actions/check-dco@main
        id: dco
        with:
          add-comments: "false"
      - name: Record check result
        if: ${{ always() && (steps.dco.outcome == 'success' || steps.dco.outcome == 'failure') }}
        env:
          pull_request_number: ${{ github.event.pull_request.number }}
          check_result: ${{ steps.dco.outcome == 'failure' && 'fail' || 'pass' }}
        run: |
          mkdir pr-check-result
          echo "$pull_request_number" > pr-check-result/pr-number
          echo "$check_result" > pr-check-result/result
      - name: Upload check result
        if: ${{ always() && (steps.dco.outcome == 'success' || steps.dco.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-check-result-dco
          path: pr-check-result/
          retention-days: 1
